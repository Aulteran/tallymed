name: tallymed
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tallymed
      POSTGRES_USER: tallymed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tallymed", "-d", "tallymed"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tallymed:${POSTGRES_PASSWORD}@db:5432/tallymed
      TALLYMED_CANONICAL_ORIGIN: ${TALLYMED_CANONICAL_ORIGIN:-http://127.0.0.1:3001}
      TALLYMED_PROXY_SECRET: ${TALLYMED_PROXY_SECRET:-}
      TALLYMED_SOURCE_URL: ${TALLYMED_SOURCE_URL:-}
      # Optional: addresses or CIDR ranges of your reverse proxy (also editable by an administrator in Settings > Reverse proxy).
      TALLYMED_TRUSTED_PROXIES: ${TALLYMED_TRUSTED_PROXIES:-}
      # Optional: key that encrypts the SMTP password stored by Settings > Email. `openssl rand -base64 32`; keep a copy in a password manager, apart from your backups.
      TALLYMED_SECRETS_KEY: ${TALLYMED_SECRETS_KEY:-}
      # Optional one-time setup token for creating the first administrator. Empty: the server generates one and prints it to its console.
      TALLYMED_SETUP_TOKEN: ${TALLYMED_SETUP_TOKEN:-}
      # Private document volume (outside the web root). Backed up together with PostgreSQL.
      TALLYMED_DOCUMENTS_DIR: /var/lib/tallymed/documents
    volumes:
      - documents_data:/var/lib/tallymed/documents
    ports:
      - "127.0.0.1:${TALLYMED_WEB_PORT:-3001}:3000"
  # Optional assistant (MCP) listener. Off unless you start the `mcp` profile AND set TALLYMED_MCP_ENABLED=true. See docs/mcp.md: create the
  # restricted database role first (setup-role), keep the published port on a private interface, and never route it through the web proxy.
  mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: infra/Dockerfile.mcp
    depends_on:
      db:
        condition: service_healthy
    environment:
      TALLYMED_MCP_ENABLED: ${TALLYMED_MCP_ENABLED:-false}
      TALLYMED_MCP_CONTAINER: "true"
      TALLYMED_MCP_BIND: 0.0.0.0
      TALLYMED_MCP_DATABASE_URL: postgres://tallymed_mcp:${TALLYMED_MCP_DB_PASSWORD:-unset}@db:5432/tallymed
      TALLYMED_MCP_TLS_CERT_FILE: /run/tallymed-mcp/tls.crt
      TALLYMED_MCP_TLS_KEY_FILE: /run/tallymed-mcp/tls.key
      TALLYMED_MCP_ALLOWED_CIDRS: ${TALLYMED_MCP_ALLOWED_CIDRS:-}
      TALLYMED_MCP_ALLOWED_HOSTS: ${TALLYMED_MCP_ALLOWED_HOSTS:-}
      TALLYMED_DOCUMENTS_DIR: /var/lib/tallymed/documents
    volumes:
      - ${TALLYMED_MCP_TLS_DIR:-./.mcp-tls}:/run/tallymed-mcp:ro
      # Needed only for the document-file scope; read-only.
      - documents_data:/var/lib/tallymed/documents:ro
    ports:
      - "${TALLYMED_MCP_PUBLISH:-127.0.0.1}:${TALLYMED_MCP_PORT:-8765}:8765"
volumes:
  postgres_data:
  documents_data:
