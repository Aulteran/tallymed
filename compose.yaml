name: tallymed
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tallymed
      POSTGRES_USER: tallymed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tallymed", "-d", "tallymed"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tallymed:${POSTGRES_PASSWORD}@db:5432/tallymed
      TALLYMED_CANONICAL_ORIGIN: ${TALLYMED_CANONICAL_ORIGIN:-http://127.0.0.1:3001}
      TALLYMED_PROXY_SECRET: ${TALLYMED_PROXY_SECRET:-}
      TALLYMED_SOURCE_URL: ${TALLYMED_SOURCE_URL:-}
      # Private document volume (outside the web root). Backed up together with PostgreSQL.
      TALLYMED_DOCUMENTS_DIR: /var/lib/tallymed/documents
    volumes:
      - documents_data:/var/lib/tallymed/documents
    ports:
      - "127.0.0.1:${TALLYMED_WEB_PORT:-3001}:3000"
volumes:
  postgres_data:
  documents_data:
