name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TALLYMED_TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:export
      - name: Verify HTTPS proxy and network boundary (disposable PostgreSQL)
        run: npm run test:proxy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:performance
      - name: Verify expense screens in a browser (disposable PostgreSQL)
        run: npm run test:app-browser
      - name: Verify repository-path export
        run: npm run build:marketing && npm run test:export && npm run test:browser && npm run test:performance
        env:
          NEXT_PUBLIC_BASE_PATH: /tallymed-example
          SITE_ORIGIN: https://example.github.io
          TALLYMED_REPOSITORY: example/tallymed-example
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      TALLYMED_SETUP_TOKEN: ci-synthetic-setup-token-0f3a9c7e1b5d2468
    steps:
      - uses: actions/checkout@v6
      - name: Validate release Compose file
        run: docker compose -f deploy/compose.release.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-disposable-only
          TALLYMED_WEB_IMAGE: ghcr.io/aulteran/tallymed-web:sha-000000000000
          TALLYMED_CANONICAL_ORIGIN: https://tallymed.example
          TALLYMED_PROXY_SECRET: ci-disposable-proxy-secret-0123456789
      - name: Start synthetic development stack
        run: docker compose --env-file .env.example up --build --detach --wait
      - name: Check web and database independently
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:3001/healthz
          docker compose --env-file .env.example run --rm web node apps/web/cli/migrate.ts
          # The server prints its setup notice once the schema exists. The token comes from TALLYMED_SETUP_TOKEN (job env), so the
          # notice names the variable and must not contain the value.
          for i in $(seq 1 30); do
            docker compose --env-file .env.example logs web | grep -q 'TallyMed setup is required' && break
            sleep 1
          done
          docker compose --env-file .env.example logs web | grep -q 'TallyMed setup is required'
          if docker compose --env-file .env.example logs web | grep -qF "$TALLYMED_SETUP_TOKEN"; then echo 'the configured setup token appears in the web log'; exit 1; fi
          curl --fail http://127.0.0.1:3001/setup | grep -q 'Create the first administrator'
          setup() { curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://127.0.0.1:3001' -H 'Content-Type: application/json' \
            -d "{\"setupToken\":\"$1\",\"householdName\":\"Example Family\",\"displayName\":\"Alex Example\",\"email\":\"admin@example.test\",\"password\":\"synthetic ci passphrase\"}" \
            http://127.0.0.1:3001/api/setup; }
          test "$(setup wrong-setup-token)" = 403
          test "$(setup "$TALLYMED_SETUP_TOKEN")" = 201
          test "$(setup "$TALLYMED_SETUP_TOKEN")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/setup)" = 404
          curl --fail http://127.0.0.1:3001/login | grep -q 'Sign in'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://127.0.0.1:3001' \
            -H 'Content-Type: application/json' -d '{"email":"admin@example.test","password":"synthetic ci passphrase"}' \
            http://127.0.0.1:3001/api/auth/login)
          test "$code" = 200
          docker compose --env-file .env.example exec -T db psql -v ON_ERROR_STOP=1 -U tallymed -d tallymed -c "SELECT 1;"
      - name: Check operator commands in the built images
        run: |
          set -euo pipefail
          docker compose --env-file .env.example run --rm web node apps/web/cli/documents.ts verify
          docker compose --env-file .env.example --profile mcp build mcp
          printf 'synthetic-ci-role-password-0123456789' | docker compose --env-file .env.example --profile mcp run --rm -T \
            -e DATABASE_URL=postgres://tallymed:local-dev-only@db:5432/tallymed mcp node apps/web/cli/mcp.ts setup-role
          # The assistant listener must stay off unless explicitly enabled.
          docker compose --env-file .env.example --profile mcp run --rm mcp node apps/web/cli/mcp.ts
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs
      - name: Remove disposable stack
        if: always()
        run: docker compose --env-file .env.example down --volumes
