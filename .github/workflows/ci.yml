name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  unit:
    name: unit (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TALLYMED_TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Typecheck
        if: matrix.shard == 1
        run: npm run typecheck
      - run: node --test --test-shard=${{ matrix.shard }}/3
  app-browser:
    name: app-browser (${{ matrix.scheme }} theme)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scheme: [light, dark]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TALLYMED_TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-web-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx', 'apps/web/**/*.mjs', 'apps/web/**/*.css', '!apps/web/.next/**', '!apps/web/node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-next-web-${{ hashFiles('package-lock.json') }}-
      - run: npm run build -w @tallymed/web
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium
      - name: Install Playwright Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Verify expense screens and contrast in the ${{ matrix.scheme }} theme (disposable PostgreSQL)
        run: npm run test:app-browser
        env:
          TALLYMED_COLOR_SCHEME: ${{ matrix.scheme }}
  marketing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/marketing/.next/cache
          key: ${{ runner.os }}-next-marketing-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/marketing/**/*.[jt]s', 'apps/marketing/**/*.[jt]sx', 'apps/marketing/**/*.mjs', 'apps/marketing/**/*.css', '!apps/marketing/.next/**', '!apps/marketing/node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-next-marketing-${{ hashFiles('package-lock.json') }}-
      - run: npm run build:marketing
      - run: npm run test:export
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium
      - name: Install Playwright Chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run test:browser
      - run: npm run test:performance
      - name: Verify repository-path export
        run: npm run build:marketing && npm run test:export && npm run test:browser && npm run test:performance
        env:
          NEXT_PUBLIC_BASE_PATH: /tallymed-example
          SITE_ORIGIN: https://example.github.io
          TALLYMED_REPOSITORY: example/tallymed-example
  proxy-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TALLYMED_TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-web-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/web/**/*.[jt]s', 'apps/web/**/*.[jt]sx', 'apps/web/**/*.mjs', 'apps/web/**/*.css', '!apps/web/.next/**', '!apps/web/node_modules/**') }}
          restore-keys: |
            ${{ runner.os }}-next-web-${{ hashFiles('package-lock.json') }}-
      - run: npm run build -w @tallymed/web
      - name: Verify HTTPS proxy and network boundary (disposable PostgreSQL)
        run: npm run test:proxy
      - name: Verify backup and restore reconciliation with a PostgreSQL 17 client (disposable PostgreSQL)
        run: |
          # The PGDG setup script runs its own apt-get update after adding the repository, so the client install needs no further update.
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get -o Acquire::Retries=3 install -y -qq postgresql-client-17
          PATH=/usr/lib/postgresql/17/bin:$PATH npm run test:restore
  compose-smoke:
    runs-on: ubuntu-latest
    env:
      TALLYMED_SETUP_TOKEN: k7Qz4mVx9LpR2wTn8YbH5cJd3FgS6aUe
    steps:
      - uses: actions/checkout@v6
      - name: Validate release Compose file
        run: docker compose -f deploy/compose.release.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-disposable-only
          TALLYMED_WEB_IMAGE: ghcr.io/aulteran/tallymed-web:sha-000000000000
          TALLYMED_CANONICAL_ORIGIN: https://tallymed.example
          TALLYMED_PROXY_SECRET: ci-disposable-proxy-secret-0123456789
      - name: Start synthetic development stack
        run: docker compose --env-file .env.example up --build --detach --wait
      - name: Check web and database independently
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:3001/healthz
          docker compose --env-file .env.example run --rm web node apps/web/cli/migrate.ts
          # The server prints its setup notice once the schema exists. The token comes from TALLYMED_SETUP_TOKEN (job env), so the
          # notice names the variable and must not contain the value.
          for i in $(seq 1 30); do
            docker compose --env-file .env.example logs web | grep -q 'TallyMed setup is required' && break
            sleep 1
          done
          docker compose --env-file .env.example logs web | grep -q 'TallyMed setup is required'
          if docker compose --env-file .env.example logs web | grep -qF "$TALLYMED_SETUP_TOKEN"; then echo 'the configured setup token appears in the web log'; exit 1; fi
          curl --fail http://127.0.0.1:3001/setup | grep -q 'Create the first administrator'
          setup() { curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://127.0.0.1:3001' -H 'Content-Type: application/json' \
            -d "{\"setupToken\":\"$1\",\"householdName\":\"Example Family\",\"displayName\":\"Alex Example\",\"email\":\"admin@example.test\",\"password\":\"synthetic ci passphrase\"}" \
            http://127.0.0.1:3001/api/setup; }
          test "$(setup wrong-setup-token)" = 403
          test "$(setup "$TALLYMED_SETUP_TOKEN")" = 201
          test "$(setup "$TALLYMED_SETUP_TOKEN")" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/setup)" = 404
          curl --fail http://127.0.0.1:3001/login | grep -q 'Sign in'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://127.0.0.1:3001' \
            -H 'Content-Type: application/json' -d '{"email":"admin@example.test","password":"synthetic ci passphrase"}' \
            http://127.0.0.1:3001/api/auth/login)
          test "$code" = 200
          docker compose --env-file .env.example exec -T db psql -v ON_ERROR_STOP=1 -U tallymed -d tallymed -c "SELECT 1;"
      - name: Check operator commands in the built images
        run: |
          set -euo pipefail
          docker compose --env-file .env.example run --rm web node apps/web/cli/documents.ts verify
          docker compose --env-file .env.example --profile mcp build mcp
          printf 'synthetic-ci-role-password-0123456789' | docker compose --env-file .env.example --profile mcp run --rm -T \
            -e DATABASE_URL=postgres://tallymed:local-dev-only@db:5432/tallymed mcp node apps/web/cli/mcp.ts setup-role
          # The assistant listener must stay off unless explicitly enabled.
          docker compose --env-file .env.example --profile mcp run --rm mcp node apps/web/cli/mcp.ts
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs
      - name: Remove disposable stack
        if: always()
        run: docker compose --env-file .env.example down --volumes
  verify:
    if: always()
    needs: [unit, app-browser, marketing, proxy-restore, compose-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require every verification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e 'to_entries | length == 5 and all(.value.result == "success")' > /dev/null
