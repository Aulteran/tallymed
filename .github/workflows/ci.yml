name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-disposable-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TALLYMED_TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:export
      - name: Verify HTTPS proxy and network boundary (disposable PostgreSQL)
        run: npm run test:proxy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:performance
      - name: Verify repository-path export
        run: npm run build:marketing && npm run test:export && npm run test:browser && npm run test:performance
        env:
          NEXT_PUBLIC_BASE_PATH: /tallymed-example
          SITE_ORIGIN: https://example.github.io
          TALLYMED_REPOSITORY: example/tallymed-example
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Start synthetic development stack
        run: docker compose --env-file .env.example up --build --detach --wait
      - name: Check web and database independently
        run: |
          curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://127.0.0.1:3001/healthz
          docker compose --env-file .env.example run --rm web node apps/web/cli/migrate.ts
          printf 'synthetic ci passphrase' | docker compose --env-file .env.example run --rm -T \
            -e TALLYMED_BOOTSTRAP_EMAIL=admin@example.test -e TALLYMED_BOOTSTRAP_NAME='Alex Example' \
            -e TALLYMED_HOUSEHOLD_NAME='Example Family' web node apps/web/cli/bootstrap.ts
          curl --fail http://127.0.0.1:3001/login | grep -q 'Sign in'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://127.0.0.1:3001' \
            -H 'Content-Type: application/json' -d '{"email":"admin@example.test","password":"synthetic ci passphrase"}' \
            http://127.0.0.1:3001/api/auth/login)
          test "$code" = 200
          docker compose --env-file .env.example exec -T db psql -v ON_ERROR_STOP=1 -U tallymed -d tallymed -c "SELECT 1;"
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs
      - name: Remove disposable stack
        if: always()
        run: docker compose --env-file .env.example down --volumes
