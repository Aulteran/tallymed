name: Marketing Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marketing-pages
  cancel-in-progress: false
env:
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: node --test tests/marketing.test.mjs
      - name: Export and verify marketing site
        run: npm run build:marketing && npm run test:export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}
          TALLYMED_REPOSITORY: ${{ github.repository }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/marketing/out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy
