# Operator stack that runs published TallyMed images instead of building from source. See docs/operations.md.
# Usage: copy deploy/release.env.example to deploy/.env, edit it, then
#   docker compose --env-file deploy/.env -f deploy/compose.release.yaml up -d --wait
name: tallymed
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tallymed
      POSTGRES_USER: tallymed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tallymed", "-d", "tallymed"]
      interval: 5s
      timeout: 3s
      retries: 12
  web:
    image: ${TALLYMED_WEB_IMAGE:?Set TALLYMED_WEB_IMAGE to ghcr.io/aulteran/tallymed-web:sha-<commit> or an @sha256 digest reference}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://tallymed:${POSTGRES_PASSWORD}@db:5432/tallymed
      TALLYMED_CANONICAL_ORIGIN: ${TALLYMED_CANONICAL_ORIGIN:?Set the public https origin}
      TALLYMED_PROXY_SECRET: ${TALLYMED_PROXY_SECRET:?Set a random secret of 32 or more characters shared with the proxy}
      TALLYMED_SOURCE_URL: ${TALLYMED_SOURCE_URL:-}
      # Optional: addresses or CIDR ranges of your reverse proxy (also editable by an administrator in Settings > Reverse proxy).
      TALLYMED_TRUSTED_PROXIES: ${TALLYMED_TRUSTED_PROXIES:-}
      # Optional: key that encrypts the SMTP password stored by Settings > Email. `openssl rand -base64 32`; keep a copy in a password manager, apart from your backups.
      TALLYMED_SECRETS_KEY: ${TALLYMED_SECRETS_KEY:-}
      # Optional one-time setup token for creating the first administrator. Empty: the server generates one and prints it to its console.
      TALLYMED_SETUP_TOKEN: ${TALLYMED_SETUP_TOKEN:-}
      TALLYMED_DOCUMENTS_DIR: /var/lib/tallymed/documents
    volumes:
      - documents_data:/var/lib/tallymed/documents
    ports:
      # Private interface only. The reverse proxy on this host forwards to it; never publish it on a public address.
      - "127.0.0.1:${TALLYMED_WEB_PORT:-3001}:3000"
  # Optional assistant listener. Off unless you start the `mcp` profile AND set TALLYMED_MCP_ENABLED=true (docs/mcp.md).
  mcp:
    profiles: ["mcp"]
    image: ${TALLYMED_MCP_IMAGE:-ghcr.io/aulteran/tallymed-mcp:unset-pin-an-image}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
    environment:
      TALLYMED_MCP_ENABLED: ${TALLYMED_MCP_ENABLED:-false}
      TALLYMED_MCP_CONTAINER: "true"
      TALLYMED_MCP_BIND: 0.0.0.0
      TALLYMED_MCP_DATABASE_URL: postgres://tallymed_mcp:${TALLYMED_MCP_DB_PASSWORD:-unset}@db:5432/tallymed
      TALLYMED_MCP_TLS_CERT_FILE: /run/tallymed-mcp/tls.crt
      TALLYMED_MCP_TLS_KEY_FILE: /run/tallymed-mcp/tls.key
      TALLYMED_MCP_ALLOWED_CIDRS: ${TALLYMED_MCP_ALLOWED_CIDRS:-}
      TALLYMED_MCP_ALLOWED_HOSTS: ${TALLYMED_MCP_ALLOWED_HOSTS:-}
      TALLYMED_DOCUMENTS_DIR: /var/lib/tallymed/documents
    volumes:
      # Relative paths resolve next to this file, so the default is deploy/.mcp-tls. Create it with tls.crt and tls.key before starting.
      - ${TALLYMED_MCP_TLS_DIR:-./.mcp-tls}:/run/tallymed-mcp:ro
      - documents_data:/var/lib/tallymed/documents:ro
    ports:
      - "${TALLYMED_MCP_PUBLISH:-127.0.0.1}:${TALLYMED_MCP_PORT:-8765}:8765"
volumes:
  postgres_data:
  documents_data:
